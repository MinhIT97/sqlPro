<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SqlPro · Database workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="rail">
    <div class="logo">S<span>↗</span></div>
    <button title="Workspace" aria-label="Workspace" class="active" data-click="view" data-view="data">▦</button>
    <button title="Kết nối mới" aria-label="Kết nối mới" data-click="new-connection">⌘</button>
    <button title="SQL Editor" aria-label="SQL Editor" data-click="view" data-view="query">⌑</button>
    <button title="Lịch sử" aria-label="Lịch sử truy vấn" data-click="view" data-view="history">◷</button>
    <button class="railaccount" id="accountButton" title="Tài khoản và đồng bộ" aria-label="Tài khoản và đồng bộ" data-click="account">
      <span id="accountInitials">SP</span>
      <i class="syncdot" id="syncDot"></i>
    </button>
  </aside>

  <aside class="sidebar">
    <div class="brand">SqlPro <span id="runtimeBadge">WORKSPACE</span></div>
    <div class="workspacebar">
      <select id="workspaceSelect" title="Chọn workspace" aria-label="Chọn workspace"></select>
      <button title="Workspace mới" aria-label="Workspace mới" data-click="workspace-form">＋</button>
      <button title="Quản lý workspace" aria-label="Quản lý workspace" data-click="workspace-manager">⚙</button>
    </div>
    <div class="sideheading">KẾT NỐI
      <span class="headingactions">
        <button title="Nhập kết nối Navicat" aria-label="Nhập kết nối Navicat" data-click="import-navicat">⇩</button>
        <button title="Kết nối mới" aria-label="Kết nối mới" data-click="new-connection">＋</button>
      </span>
    </div>
    <label class="search">⌕ <input id="treeSearch" aria-label="Tìm kết nối và bảng" placeholder="Tìm kết nối, bảng…"></label>
    <div id="connectionList"></div>
    <div class="sidefoot">
      <span class="dot" id="connDot"></span>
      <span id="connState">Chưa kết nối</span>
      <button title="Ngắt kết nối" aria-label="Ngắt kết nối" data-click="disconnect">⏻</button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <span class="muted">Workspace</span>
        <span class="slash">/</span>
        <span id="crumbServer">CHƯA KẾT NỐI</span>
        <span class="slash">/</span>
        <span id="crumbDb">—</span>
        <span class="env">LIVE</span>
      </div>
      <div>
        <button data-click="processlist" title="Quản lý tiến trình MySQL (Processlist)">🖥️ Tiến trình</button>
        <button data-click="server-vars" title="Xem cấu hình & trạng thái server">⚙️ Biến hệ thống</button>
        <button data-click="shortcuts" title="Bảng tra cứu phím tắt (F1)">⌨️ Phím tắt</button>
        <button data-click="view" data-view="query">Ctrl K &nbsp; SQL Editor</button>
        <button class="theme-btn" id="themeToggleBtn" data-click="toggle-theme" title="Chuyển chế độ Giao diện Sáng / Tối">☀️ Sáng</button>
        <button data-click="erd" title="Sơ đồ quan hệ CSDL (ERD)">📊 ERD</button>
        <button class="avatar header-avatar" id="accountAvatar" title="Tài khoản và đồng bộ" data-click="account">SP</button>
      </div>
    </header>
    <div class="tabs" id="tabs">
      <button id="dataTab" class="selected" data-click="view" data-view="data">▦ &nbsp; <span id="tabName">—</span> &nbsp; ×</button>
      <span id="queryTabs"></span>
      <button id="transferTab" class="transfer-tab" data-click="view" data-view="transfer" hidden>↓ &nbsp; Tác vụ database</button>
      <button id="newQueryTab" data-click="new-query" title="Truy vấn mới (Ctrl+T)" aria-label="Truy vấn mới">＋</button>
    </div>
    <section class="content">
      <div class="titleline">
        <div>
          <div class="eyebrow" id="eyebrow">CHƯA CHỌN DATABASE / BẢNG</div>
          <h1 id="title">Workspace <span>TABLE</span></h1>
          <p id="subtitle">Chọn một bảng để xem dữ liệu thật.</p>
        </div>
        <button class="primary" data-click="new-query">＋ &nbsp; Truy vấn mới</button>
      </div>
      <nav id="subnav">
        <button class="current" data-click="view" data-view="data">Dữ liệu</button>
        <button data-click="view" data-view="structure">Cấu trúc</button>
        <button data-click="view" data-view="indexes">Indexes</button>
        <button data-click="view" data-view="relations">Quan hệ</button>
        <button data-click="erd" title="Sơ đồ thực thể trực quan (ERD)">📊 Sơ đồ ERD</button>
      </nav>
      <div id="workspace"></div>
    </section>
    <footer>
      <span><i class="dot"></i> <span id="serverInfo">Chưa kết nối</span></span>
      <span id="status">Sẵn sàng <b>•</b> UTF-8</span>
    </footer>
  </main>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="contextMenu" class="context-menu hidden"></div>
  <script src="sql-autocomplete.js"></script>
  <script src="row-values.js"></script>
  <script src="export-values.js"></script>
  <script src="query-results.js"></script>
  <script src="app.js"></script>
  <script src="desktop.js"></script>
</body>
</html>
