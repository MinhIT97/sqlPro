services:
  sqlpro:
    build: .
    container_name: sqlpro
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SQLPRO_DB: /data/sqlpro.db
      WEBSITE_DIR: /app/website
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"
      MAX_VAULT_BYTES: "${MAX_VAULT_BYTES:-5242880}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - sqlpro-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlpro-data:
