<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SqlPro · Database workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="rail">
    <div class="logo">S<span>↗</span></div>
    <button title="Workspace" class="active" onclick="view('data')">▦</button>
    <button title="Kết nối mới" onclick="connection()">⌘</button>
    <button title="SQL Editor" onclick="view('query')">⌑</button>
    <button title="Lịch sử" onclick="view('history')">◷</button>
    <div class="railbottom">SP</div>
  </aside>

  <aside class="sidebar">
    <div class="brand">SqlPro <span id="runtimeBadge">WORKSPACE</span></div>
    <div class="sideheading">CONNECTIONS
      <span class="headingactions">
        <button title="Nhập kết nối Navicat" onclick="importNavicat()">⇩</button>
        <button title="Kết nối mới" onclick="connection()">＋</button>
      </span>
    </div>
    <label class="search">⌕ <input id="treeSearch" placeholder="Tìm kết nối, bảng…"></label>
    <div id="connectionList"></div>
    <div id="databaseTree"></div>
    <div class="sidefoot">
      <span class="dot" id="connDot"></span>
      <span id="connState">Chưa kết nối</span>
      <button title="Ngắt kết nối" onclick="disconnect()">⏻</button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <span class="muted">Workspace</span>
        <span class="slash">/</span>
        <span id="crumbServer">NO CONNECTION</span>
        <span class="slash">/</span>
        <span id="crumbDb">—</span>
        <span class="env">LIVE</span>
      </div>
      <div>
        <button onclick="view('query')">Ctrl K &nbsp; SQL Editor</button>
        <span class="avatar">SP</span>
      </div>
    </header>
    <div class="tabs">
      <button id="dataTab" class="selected" onclick="view('data')">▦ &nbsp; <span id="tabName">—</span> &nbsp; ×</button>
      <button id="queryTab" onclick="view('query')">⌑ &nbsp; Query 1 &nbsp; ×</button>
      <button onclick="view('query')">＋</button>
    </div>
    <section class="content">
      <div class="titleline">
        <div>
          <div class="eyebrow" id="eyebrow">NO DATABASE / TABLES</div>
          <h1 id="title">Workspace <span>TABLE</span></h1>
          <p id="subtitle">Chọn một bảng để xem dữ liệu thật.</p>
        </div>
        <button class="primary" onclick="view('query')">＋ &nbsp; Truy vấn mới</button>
      </div>
      <nav id="subnav">
        <button class="current" onclick="view('data')">Dữ liệu</button>
        <button onclick="view('structure')">Cấu trúc</button>
        <button onclick="view('indexes')">Indexes</button>
        <button onclick="view('relations')">Quan hệ</button>
      </nav>
      <div id="workspace"></div>
    </section>
    <footer>
      <span><i class="dot"></i> <span id="serverInfo">Chưa kết nối</span></span>
      <span id="status">Sẵn sàng <b>•</b> UTF-8</span>
    </footer>
  </main>

  <dialog id="modal"></dialog>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="desktop.js"></script>
</body>
</html>
