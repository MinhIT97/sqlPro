name: Build and release desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            command: pack:linux
            artifact: sqlpro-ubuntu
          - os: windows-latest
            command: pack:windows
            artifact: sqlpro-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Renderer smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:renderer -- --no-sandbox
      - name: Renderer smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:renderer
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: SqlPro ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/sqlpro-ubuntu/*
            dist/sqlpro-windows/*
